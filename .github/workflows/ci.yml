name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cryptography (for the p256-decode selftest's cross-check)
        run: pip install cryptography==50.0.2
      - name: Catalog, manifest, provenance, selftests
        run: python3 tools/check.py
